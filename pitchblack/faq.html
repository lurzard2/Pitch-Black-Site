<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PB - Frequently Asked Questions</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Frequently Asked Questions related to the Pitch Black mod.">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/layout.css">
    <script type="module" src="./faq.js"></script>
</head>
<!--suppress CssUnusedSymbol -->
<style>
    #innerwrap {
        @media screen and (min-width: 768px) {
            display:grid;
            grid-auto-flow: column;

            #bookmarks, #text{
                height: 100vh;
                overflow-y: scroll;
                padding: 0 2rem;
            }

            #bookmarks{
                border-right: 1px var(--mute) dotted;
            }
        }
        @media screen and (max-width: 767px) {
            margin:0.5rem;
        }
    }

    #bookmarks {
        h1 {
            margin-top: 3rem;

            a {
                color: #b0aabd;
            }
        }
        h2 a {
            color: #797680;
        }
    }

    #text {
        h1 {
            color: var(--mute);
        }
    }

    #text p {
        margin-bottom: 3rem;
    }

    .else {
        color: #d2679c;
    }
</style>
<body>

<div id="wrapper">
    <div id="innerwrap">
        <div id="bookmarks">
            <p>// faq</p>
            <p class="mute">Not exactly exhaustive but a good resource for useful information nonetheless.</p>
            <p>
                Want to submit a question?
                <br>
                <a href="https://docs.google.com/forms/d/e/1FAIpQLSdHijsx0595rZQ0eAA2jPvoz7augQB8bRLfBdJlN6CS9m7kig/viewform?usp=dialog">Use the Google Form!</a>
            </p>
        </div>
        <div id="text">
            <p style="color:var(--bg);margin-bottom: auto">// faq</p>
        </div>
    </div>
</div>

</body>
</html>
