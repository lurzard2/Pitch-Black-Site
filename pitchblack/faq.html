<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PB - FAQ</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Frequently Asked Questions related to the Pitch Black mod.">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/layout.css">
    <script type="module" src="./faq.js"></script>
</head>
<style>
    #text p {
        margin-bottom: 3rem
    }

    #innerwrap {
        @media screen and (min-width: 768px) {
            display:grid;
            grid-auto-flow: column;
            gap: 3rem;

            #bookmarks #text{
                height: 100dvh;
                overflow: scroll;
            }
        }
    }

    #bookmarks {
        h1 a {
            color: #bdbdbd;
        }
        h2 a {
            color: #808080;
        }
    }
</style>
<body>

<div id="wrapper" style="background-color: black">
    <div id="innerwrap" style="margin:0.5rem;">
        <div id="bookmarks">
            <p>// faq</p>
        </div>
        <div id="text">
            <p style="color:var(--bg);margin-bottom: auto">// faq</p>
        </div>
    </div>
</div>

</body>
</html>
