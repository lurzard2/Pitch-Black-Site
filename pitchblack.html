<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rain World: Pitch Black</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Page dedicated to the in-dev Pitch Black mod for Rain World.">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/layout.css">
</head>
<style>
    .link-button{
        font: var(--font); color:var(--mute); background-color:var(--bg); border: 1px solid var(--mute); padding:1.5rem;
    }
</style>
<body>

<div id="wrapper" style="background-color: black">
    <div style="margin:0.5rem">

        <p class="center"><span class="mute">// rain world :</span><b>pitch black</b></p>

        <div id="trailer-player" style="display:flex; justify-content: center;">
            <iframe style="border: 1px solid var(--text)"
                    width="560"
                    height="315"
                    src="https://www.youtube.com/embed/1FXMEJQgM2M?si=lQX9t3xlAvdJ83QO"
                    title="YouTube video player"
                    frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    referrerpolicy="strict-origin-when-cross-origin"
                    allowfullscreen>
            </iframe>
        </div>

        <div style=" display:flex; justify-content: space-between; margin-top:0.5rem">
            <p>STATE...</p>
            <p id="updatable-mod-state">...UNRELEASED</p>
        </div>

        <div style=" display:flex; justify-content: space-between">
            <p>LAST UPDATE...</p>
            <p id="updatable-last-update-time">...04/04/26</p>
        </div>

        <div style=" display:flex; justify-content: space-between">
            <p>VERSION...</p>
            <p id="updatable-mod-version">...0.6.8</p>
        </div>

        <div style=" display:flex; justify-content: space-between">
            <p>DEVELOPMENT...</p>
            <p id="updatable-mod-development">...OK</p>
        </div>

        <div style=" display:flex; justify-content: space-between; margin-bottom:0.5rem">
            <p>PLAYTESTING...</p>
            <p id="updatable-mod-playtesting">...OK</p>
        </div>

        <div class="center" style="display:grid; width: 20rem;  margin:auto">
            <button class="link-button">Steam Workshop</button>
        </div>

    </div>
</div>

</body>
</html>
