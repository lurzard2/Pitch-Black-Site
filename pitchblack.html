<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rain World: Pitch Black</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Page dedicated to the in-dev Pitch Black mod for Rain World.">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/layout.css">
    </head>
<body>

<div id="wrapper" style="background-color: black">
    <div style="margin:0.5rem">

        <p class="center">// rain world : <b>pitch black</b></p>

        <div id="trailer-player" style="display:flex; justify-content: center;">
            <iframe
                    width="560"
                    height="315"
                    src="https://www.youtube.com/embed/1FXMEJQgM2M?si=lQX9t3xlAvdJ83QO"
                    title="YouTube video player"
                    frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    referrerpolicy="strict-origin-when-cross-origin"
                    allowfullscreen>
            </iframe>
        </div>

        <div style=" display:flex; justify-content: space-between">
            <p>LAST MOD UPDATE TIME...</p>
            <p id="updatable-last-update-time">...04/04/2026 (DD/MM/YYYY)</p>
        </div>

        <div style=" display:flex; justify-content: space-between">
            <p>MOD VERSION...</p>
            <p id="updatable-mod-version">...0.6</p>
        </div>

        <div style=" display:flex; justify-content: space-between">
            <p>MOD DEVELOPMENT...</p>
            <p id="updatable-mod-development">...0.7 "TRIAL AND ERROR"</p>
        </div>

        <div style=" display:flex; justify-content: space-between">
            <p>MOD STATE...</p>
            <p id="updatable-mod-state">...UNRELEASED ACTIVE DEVELOPMENT</p>
        </div>

        <div style=" display:flex; justify-content: space-between">
            <p>MOD PLAYTESTING...</p>
            <p id="updatable-mod-playtesting">...OK</p>
        </div>



    </div>
</div>

</body>
</html>
