<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" id="theme" href="css/themes/dark.css">
    <script src="https://u.widget.st/ar.js"></script>
</head>
<style>
    #reactbox{
        width:400px;
        height: 800px;
        overflow: scroll;
        position: absolute;

        @media (width > 1600px){
            top:0;
            left:0;
        }
        @media (width <= 1600px){
            top: -500px;
            left: -500px;
        }
    }
</style>
<body>

<div id="reactbox">
    <ws-widget class="reactbox" type="reactions" iid="8439"></ws-widget>
</div>

<div id="wrapper">
    <div id="side">
    </div>
    <div id="main">

        <div style="background-image: url('images/pb.png'); background-position: center;" class="expand bg">
            <p class="expander"></p>
            <h1>Pitch Black</h1>
        </div>

        <div style="background-image: url('images/vg.png'); background-position: right center" class="expand bg">
            <p class="expander"></p>
            <h1 style="color:black">Visceral Grove</h1>
        </div>

        <a href="kotclicker" target="_blank" class="hidelink">
        <div style="background-image: url('images/kc.png'); background-position: center;" class="expand bg">
            <p class="expander"></p>
            <h1 style="color:white">Kot Clicker</h1>
        </div>
        </a>

    </div>
</div>
<script type="module" src="js/header.js"></script>
<script type="module" src="js/main.js"></script>

</body>
</html>
