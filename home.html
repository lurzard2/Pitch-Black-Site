<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" id="theme" href="css/themes/dark.css">
    <script src="https://u.widget.st/ar.js"></script>
</head>
<style>
    #reactbox{
        width:400px;
        height: 800px;
        overflow: scroll;
        position: absolute;

        @media (width > 1600px){
            top:0;
            left:0;
        }
        @media (width <= 1600px){
            top: -500px;
            left: -500px;
        }
    }

    ul{
        list-style-type:none;
        padding: 0;
        margin: auto;

        li {
            list-style: none;
            margin: 30px 0;

            a {
                color: var(--text);
                text-decoration: none;
                font-size: xxx-large;
            }
        }
    }
</style>
<body>

<div id="reactbox">
    <ws-widget class="reactbox" type="reactions" iid="8439"></ws-widget>
</div>

<div id="wrapper">
    <div id="side">
    </div>
    <div id="main">
        <p class="user"></p>

        <h1>Pitch Black</h1>
        <p class="m">
            <span class="mute">(Rain World Mod)</span> A collaborative project with a lot of cool people working on it.
            <br>
            <em class="mute">Page under construction...</em>
        </p>

        <h1>Visceral Grove</h1>
        <p class="m">
            <span class="mute">(Webgame)</span> Ummmmm uhhhh
            <br>
            <em class="mute">Page under construction...</em>
        </p>

        <h1><a target="_blank" href="kotclicker">Kot Clicker</a></h1>
        <p class="m">
            <span class="mute">(Webgame)</span> Consider this my first game.
            <br>
            <em class="mute">In-Dev page available</em>
        </p>
    </div>
</div>
<script type="module" src="js/header.js"></script>
<script type="module" src="js/main.js"></script>

</body>
</html>
