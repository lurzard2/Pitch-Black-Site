<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kot Clicker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css" fetchpriority="low">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/kotclicker.css">
    <link rel="stylesheet" id="theme" href="css/themes/dark.css">
</head>
<style>

    .cont{
        background-color: #4b4e57;
        background-image: url(images/tile.jpg);
        width: 100%;
        height: 100%;
        display: grid;
        align-items: center;
        justify-content: center;
        align-content: center;

        #kot-holder{
            display: flex;
            align-items: center;
            justify-content: center;
            width: 10rem;
            height: 10rem;

            #kot-button{
                height: 100%;
                width: 100%;
            }
        }

        #kot-ui{
            display: grid;
            row-gap: 0.5rem;
            position: absolute;
            top: 0;
            left: 0;
            margin: 1rem 0 0 1rem;
        }

        #kot-tutorial{
            width: 2rem;
        }
        #kot-tutorial:hover{
            opacity: 0.8;
        }
    }
</style>
<body>

<div class="cont">
    <div id="kot-ui">
        <div style="display:flex">
            <img src="images/kotclicker/kurrency.gif" alt="$">
            <p class="kot-count"></p>
        </div>
        <img id="kot-tutorial" src="images/kotclicker/question.gif">
    </div>
    <div id="kot-holder"></div>
</div>

<script type="module" src="js/main.js"></script>
<script type="module" src="js/kotclicker.js"></script>

</body>
</html>
