<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kot Clicker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css" fetchpriority="low">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" id="theme" href="css/themes/dark.css">
</head>
<style>
    body{
        display: grid;
        grid-auto-flow: row;
        grid-auto-rows: 100dvh 20dvh 50dvh;
        align-items: center;
    }

    .cont{
        background-color: #8f8f9f;
        width: 100%;
        height: 100%;
        display: grid;
        align-items: center;
        justify-content: center;
        align-content: center;

        #kotholder{
            display: flex;
            align-items: center;
            justify-content: center;
            width: 20rem;
            height: 20rem;

            #kotbutton{
                height: 100%;
                width: 100%;
            }
        }

        #kot-counter{
            overflow-x: auto;
            text-align: center;
        }
    }

    .abs{
        position: absolute;
        top: 0;
        left: 0;
    }
</style>
<body>

<div class="cont">

    <div style="display:inline-flex; justify-content: space-between;">
        <a href="home.html">Go home?</a>
        <p id="kot-name">Kot</p>
    </div>

    <div id="kotholder"></div>

    <p class="abs mute">Credit: Kot Clicker by Tetraneo :)</p>

    <p id="kot-counter"></p>

</div>

<div class="cont">
    <p>Kollection - N/A - (A way to track your kots as you find em)</p>
</div>

<div class="cont">
    <p>Konfig - WIP - (qol options)</p>
    <div>
        <input id="k-visibility" type="Checkbox">
        <label for="k-visibility">Reduced Eyestrain Mode</label>
    </div>
</div>

<script type="module" src="js/savedata.js"></script>
<script type="module" src="js/kotclicker.js"></script>

</body>
</html>
