<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kot Clicker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css" fetchpriority="low">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/kotclicker.css">
    <link rel="stylesheet" id="theme" href="css/themes/dark.css">
</head>
<style>

    .cont{
        background-color: #6e6e7c;
        width: 100%;
        height: 100%;
        display: grid;
        align-items: center;
        justify-content: center;
        align-content: center;

        #kot-holder{
            display: flex;
            align-items: center;
            justify-content: center;
            width: 10rem;
            height: 10rem;

            #kot-button{
                height: 100%;
                width: 100%;
            }
        }

        .kot-count{
            position: absolute;
            top: 0;
            left: 0;
        }
    }
</style>
<body>

<div class="cont">
    <p class="kot-count"></p>
    <div id="kot-holder"></div>

</div>

<script type="module" src="js/main.js"></script>
<script type="module" src="js/kotclicker.js"></script>

</body>
</html>
