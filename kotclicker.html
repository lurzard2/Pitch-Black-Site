<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kot Clicker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css" fetchpriority="low">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/kotclicker.css">
    <link rel="stylesheet" id="theme" href="css/themes/dark.css">
</head>
<style>

    .cont{
        background-color: #9599af;
        /*background-image: url(images/tile.jpg);*/
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;

        #kot-holder{
            display: flex;
            align-items: center;
            justify-content: center;
            width: 15rem;
            height: 15rem;

            #kot-button{
                height: 100%;
                width: 100%;
            }
        }

        #kot-ui{
            display: grid;
            row-gap: 0.5rem;
            position: absolute;
            top: 0;
            left: 0;
            margin: 1rem 0 0 1rem;
        }

        #kot-tutorial{
            width: 2rem;
        }
        #kot-tutorial:hover{
            opacity: 0.8;
        }
    }
</style>
<body>

<div class="cont">
    <div id="kot-ui">
        <div style="display:flex">
            <img src="images/kotclicker/koty.gif" alt="$">
            <p class="kot-count"></p>
        </div>
        <div style="display:flex">
            <img width="20px" src="images/kotclicker/koty-meimei.jpg" alt="M">
            <p class="kot-meimei"></p>
        </div>
        <div style="display:flex">
            <img width="20px" src="images/kotclicker/kots/kotgoated.webp" alt="G">
            <p class="kot-goated"></p>
        </div>
        <img id="kot-tutorial" src="images/kotclicker/question.gif">
    </div>

    <div id="kot-holder"></div>
</div>

<div id="kot-spawns" style="position: absolute; left: 0; top: 0"></div>
<div id="kot-chat" style="position: absolute; right: 0; bottom: 0; margin:1rem; display: flex; flex-direction: column"></div>

<script type="module" src="js/main.js"></script>
<script type="module" src="js/kotclicker.js"></script>

</body>
</html>
